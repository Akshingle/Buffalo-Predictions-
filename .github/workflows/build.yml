name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v3
    
    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
    
    - name: Check Build Output
      if: always()
      run: |
        echo "=== Build Log (last 300 lines) ==="
        tail -300 build.log
        echo ""
        echo "=== Checking for APK ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✓ APK found!"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "✗ APK NOT found at expected location"
          echo "Directory contents:"
          find app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== Full build.log ==="
          wc -l build.log
          cat build.log | tail -50
        fi
    
    - name: Upload APK to artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: buffalo-predictor-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
