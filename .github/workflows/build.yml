name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Debug: Check Android SDK
      run: |
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
        echo "ANDROID_HOME=${ANDROID_HOME}"
        ls -la /usr/local/lib/android/sdk 2>/dev/null || echo "SDK not found at /usr/local/lib/android/sdk"
        ls -la ${ANDROID_SDK_ROOT} 2>/dev/null || echo "SDK not found at ${ANDROID_SDK_ROOT}"
    
    - name: Validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v3
    
    - name: Build APK
      run: ./gradlew clean assembleDebug --stacktrace
    
    - name: Upload APK to artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: buffalo-predictor-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
