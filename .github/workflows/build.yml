name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build APK
      run: |
        set -o pipefail
        sed -i 's/\r$//' gradlew
        chmod +x ./gradlew
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
        # Run gradle and capture output, explicitly check exit code
        ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
        GRADLE_EXIT=$?
        
        # Always show last 100 lines in summary
        echo "## Build Output (last 100 lines)" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -100 /tmp/build.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        # Print to step log
        cat /tmp/build.log
        
        exit $GRADLE_EXIT
    
    - name: Upload APK to artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: buffalo-predictor-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
